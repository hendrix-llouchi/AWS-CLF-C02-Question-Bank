<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Exam Prep â€” 400 Questions</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');
  :root {
    --orange:#FF9900; --dark:#0f1117; --navy:#161b22; --card:#1c2130;
    --border:#2d3548; --text:#e6edf3; --muted:#7d8590;
    --correct:#3fb950; --incorrect:#f85149; --selected:#264f78;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

  /* HEADER */
  header{background:linear-gradient(135deg,#0f1117,#1a1f2e);border-bottom:2px solid var(--orange);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 4px 24px rgba(255,153,0,.15);}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-badge{background:var(--orange);color:#000;font-family:'Space Mono',monospace;font-weight:700;font-size:11px;padding:4px 8px;border-radius:4px;letter-spacing:1px;}
  .logo h1{font-family:'Space Mono',monospace;font-size:15px;}
  .hdr-right{display:flex;align-items:center;gap:16px;font-family:'Space Mono',monospace;}
  .score-pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;color:var(--muted);}
  .score-pill span{color:var(--orange);font-weight:700;}
  .prog-wrap{width:140px;}
  .prog-label{font-size:10px;color:var(--muted);margin-bottom:3px;display:flex;justify-content:space-between;}
  .prog-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--orange),#ffb347);border-radius:3px;transition:width .4s;}

  /* SET SELECTOR */
  #set-screen{max-width:760px;margin:0 auto;padding:48px 24px;}
  .set-title{font-family:'Space Mono',monospace;font-size:22px;color:var(--orange);margin-bottom:8px;}
  .set-sub{color:var(--muted);font-size:14px;margin-bottom:36px;line-height:1.6;}
  .sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;}
  .set-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
  .set-card:hover{border-color:var(--orange);transform:translateY(-2px);box-shadow:0 8px 32px rgba(255,153,0,.12);}
  .set-card.done{border-color:var(--correct);}
  .set-card.done:hover{border-color:var(--correct);}
  .set-num{font-family:'Space Mono',monospace;font-size:32px;font-weight:700;color:var(--orange);margin-bottom:8px;}
  .set-card.done .set-num{color:var(--correct);}
  .set-name{font-size:14px;font-weight:600;margin-bottom:6px;}
  .set-info{font-size:12px;color:var(--muted);}
  .set-score-badge{position:absolute;top:12px;right:12px;background:rgba(63,185,80,.15);border:1px solid var(--correct);color:var(--correct);font-family:'Space Mono',monospace;font-size:11px;padding:3px 8px;border-radius:8px;}
  
  /* QUIZ */
  #quiz-screen{display:none;max-width:820px;margin:0 auto;padding:28px 24px 80px;}
  .q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:28px;}
  .q-meta{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .q-num{font-family:'Space Mono',monospace;font-size:12px;color:var(--orange);background:rgba(255,153,0,.1);padding:3px 10px;border-radius:10px;}
  .q-text{font-size:16px;line-height:1.65;margin-bottom:22px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{background:var(--dark);border:1px solid var(--border);border-radius:10px;padding:13px 16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;font-size:14px;line-height:1.5;transition:all .15s;}
  .opt:hover:not(.disabled){border-color:var(--orange);background:rgba(255,153,0,.05);}
  .opt.selected{border-color:#388bfd;background:rgba(56,139,253,.1);}
  .opt.correct{border-color:var(--correct);background:rgba(63,185,80,.1);}
  .opt.incorrect{border-color:var(--incorrect);background:rgba(248,81,73,.1);}
  .opt.disabled{cursor:default;}
  .opt-ltr{font-family:'Space Mono',monospace;font-size:12px;font-weight:700;color:var(--orange);background:rgba(255,153,0,.1);min-width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .opt.correct .opt-ltr{color:var(--correct);background:rgba(63,185,80,.15);}
  .opt.incorrect .opt-ltr{color:var(--incorrect);background:rgba(248,81,73,.15);}
  .exp{margin-top:16px;padding:14px 16px;background:rgba(255,153,0,.06);border:1px solid rgba(255,153,0,.2);border-radius:10px;font-size:13px;line-height:1.6;color:#b3c0d4;display:none;}
  .exp.show{display:block;}
  .exp strong{color:var(--orange);font-family:'Space Mono',monospace;font-size:10px;display:block;margin-bottom:5px;letter-spacing:1px;}
  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px;}
  .btn{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;padding:10px 22px;border-radius:8px;cursor:pointer;border:none;transition:all .15s;}
  .btn-primary{background:var(--orange);color:#000;}
  .btn-primary:hover{background:#e88800;}
  .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
  .btn-secondary:hover{border-color:var(--orange);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);font-size:13px;padding:8px 16px;}
  .btn-ghost:hover{color:var(--text);border-color:var(--muted);}

  /* RESULTS */
  #results-screen{display:none;max-width:760px;margin:0 auto;padding:40px 24px 80px;text-align:center;}
  .score-circle{width:150px;height:150px;border-radius:50%;margin:0 auto 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Space Mono',monospace;border:6px solid var(--orange);}
  .score-circle.pass{border-color:var(--correct);background:radial-gradient(circle,rgba(63,185,80,.1),transparent);}
  .score-circle.fail{border-color:var(--incorrect);background:radial-gradient(circle,rgba(248,81,73,.1),transparent);}
  .sc-pct{font-size:38px;font-weight:700;}
  .score-circle.pass .sc-pct{color:var(--correct);}
  .score-circle.fail .sc-pct{color:var(--incorrect);}
  .sc-lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .r-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:24px 0;}
  .r-stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .r-val{font-family:'Space Mono',monospace;font-size:26px;font-weight:700;color:var(--orange);}
  .r-lbl{font-size:12px;color:var(--muted);margin-top:3px;}
  .r-dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:28px;justify-content:center;}
  .r-dot{width:26px;height:26px;border-radius:6px;font-size:10px;font-family:'Space Mono',monospace;border:1px solid var(--border);background:var(--dark);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;}
  .r-dot.correct{background:rgba(63,185,80,.2);border-color:var(--correct);color:var(--correct);}
  .r-dot.incorrect{background:rgba(248,81,73,.2);border-color:var(--incorrect);color:var(--incorrect);}
  .r-dot:hover{border-color:var(--orange);}
  .res-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px;}

  /* â”€â”€ Timer Pill â”€â”€ */
  .timer-pill{display:none;align-items:center;gap:6px;background:var(--card);border:1px solid var(--correct);border-radius:20px;padding:5px 16px;font-family:'Space Mono',monospace;transition:border-color .3s;}
  .timer-icon{font-size:13px;}
  .timer-val{font-size:14px;font-weight:700;color:var(--correct);transition:color .3s;letter-spacing:.5px;}

  /* â”€â”€ Finish Exam Button (Header) â”€â”€ */
  #finish-exam-btn{background:rgba(248,81,73,.85);color:#fff;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:7px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--incorrect);transition:all .15s;}
  #finish-exam-btn:hover{background:var(--incorrect);box-shadow:0 4px 12px rgba(248,81,73,.3);}

  /* â”€â”€ Flag Button â”€â”€ */
  .btn-flag{background:transparent;color:var(--muted);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:4px 10px;border-radius:7px;cursor:pointer;transition:all .15s;margin-left:auto;}
  .btn-flag:hover{border-color:#e3b341;color:#e3b341;}
  .btn-flag.flagged{background:rgba(227,179,65,.15);border-color:#e3b341;color:#e3b341;}

  /* â”€â”€ Lock Answer Button â”€â”€ */
  .btn-lock{background:var(--dark);color:var(--muted);border:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:10px 18px;border-radius:8px;cursor:pointer;transition:all .15s;}
  .btn-lock:not(.locked):hover:not(:disabled){border-color:var(--orange);color:var(--orange);}
  .btn-lock.locked{border-color:var(--correct);color:var(--correct);background:rgba(63,185,80,.08);cursor:default;}
  .btn-lock:disabled:not(.locked){opacity:.35;cursor:not-allowed;}

  /* â”€â”€ Finish Exam Button (inside Q-card nav) â”€â”€ */
  .btn-finish-q{background:linear-gradient(135deg,#c0392b,var(--incorrect));color:#fff;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;padding:10px 22px;border-radius:8px;cursor:pointer;border:none;transition:all .15s;box-shadow:0 4px 12px rgba(248,81,73,.25);}
  .btn-finish-q:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(248,81,73,.4);}

  /* â”€â”€ Center Nav Actions Container â”€â”€ */
  .center-actions{display:flex;gap:8px;align-items:center;}

  /* â”€â”€ Flagged Dot in Results â”€â”€ */
  .r-dot.flagged-dot{outline:2px solid #e3b341;outline-offset:2px;}

  /* â”€â”€ Placeholder Styles â”€â”€ */
  .placeholder-card{opacity:.55;}
  .placeholder-opt{opacity:.4;cursor:default!important;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-badge">AWS</div>
    <h1>Master Exam Prep</h1>
  </div>
  <div class="hdr-right">
    <div class="prog-wrap" id="hdr-prog" style="display:none">
      <div class="prog-label"><span>Progress</span><span id="prog-label">0/65</span></div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
    <div class="timer-pill" id="hdr-timer" style="display:none">
      <span class="timer-icon">â ±</span>
      <span id="timer-display" class="timer-val">01:30:00</span>
    </div>
    <div class="score-pill" id="hdr-score" style="display:none">Answered: <span id="live-score">0</span></div>
    <button class="btn" id="finish-exam-btn" style="display:none" onclick="finishExam()">Finish Exam</button>
    <button class="btn btn-ghost" id="back-btn" style="display:none" onclick="goHome()">&larr; Sets</button>
  </div>
</header>

<div id="set-screen">
  <div class="set-title">Choose Your Practice Set</div>
  <div class="set-sub">Master your AWS knowledge. 400 questions broken into batches of 50.</div>
  <div class="sets-grid" id="sets-grid"></div>
</div>

<div id="quiz-screen">
  <div id="q-container"></div>
</div>

<div id="results-screen">
  <h2 style="font-family:'Space Mono',monospace;font-size:20px;margin-bottom:6px;" id="res-title">Set Complete</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:22px;">Practice Results</p>
  <div class="score-circle" id="score-circle">
    <div class="sc-pct" id="final-pct">0%</div>
    <div class="sc-lbl" id="pass-fail-lbl">â€”</div>
  </div>
  <div class="r-grid">
    <div class="r-stat"><div class="r-val" id="r-correct">0</div><div class="r-lbl">Correct</div></div>
    <div class="r-stat"><div class="r-val" id="r-wrong" style="color:var(--incorrect)">0</div><div class="r-lbl">Incorrect</div></div>
    <div class="r-stat"><div class="r-val" id="r-pct">0%</div><div class="r-lbl">Score (pass: 70%)</div></div>
  </div>
  <div class="res-btns">
    <button class="btn btn-secondary" onclick="retakeSet()">Retake This Set</button>
    <button class="btn btn-primary" onclick="goHome()">&larr; Back to Sets</button>
  </div>
  <div class="r-dots" id="r-dots"></div>
</div>

<script>
// =====================================================================
// PASTE GENERATED QUESTION SETS BELOW THIS LINE
// =====================================================================
const SETS = [
  [
  {
    q: "Which of the following are benefits of migrating to the AWS Cloud? (Select the best combined option)",
    opts: [
      "Operational resilience & Business agility",
      "Discounts for products on Amazon.com & Business excellence",
      "Business agility & Increased staff retention",
      "Business excellence & Operational resilience"
    ],
    ans: 0,
    d: "Domain 1: Cloud Concepts",
    w: false,
    e: "AWS improves operational resilience by offering high availability and disaster recovery. It increases business agility by allowing rapid resource provisioning."
  },
  {
    q: "A company is planning to replace its physical on-premises compute servers with AWS serverless compute services. The company wants to be able to take advantage of advanced technologies quickly after the migration. Which pillar of the AWS Well-Architected Framework does this plan represent?",
    opts: [
      "Security",
      "Performance efficiency",
      "Operational excellence",
      "Reliability"
    ],
    ans: 1,
    d: "Domain 1: Cloud Concepts",
    w: true,
    e: "The Performance Efficiency pillar includes the ability to use advanced technologies (like serverless) quickly and democratize them across the team without managing complex infrastructure."
  },
  {
    q: "A company is planning to run a global marketing application in the AWS Cloud. The application will feature videos that can be viewed by users. The company must ensure that all users can view these videos with low latency. Which AWS service should the company use to meet this requirement?",
    opts: [
      "AWS Auto Scaling",
      "Amazon Kinesis Video Streams",
      "Elastic Load Balancing",
      "Amazon CloudFront"
    ],
    ans: 3,
    d: "Domain 3: Cloud Technology and Services",
    w: false,
    e: "Amazon CloudFront is a Content Delivery Network (CDN) that caches content at edge locations worldwide, delivering it to users with the lowest possible latency."
  },
  {
    q: "Which component of the AWS global infrastructure is made up of one or more discrete redundant power, networking, and connectivity?",
    opts: [
      "AWS Region",
      "Availability Zone",
      "Edge location",
      "AWS Outposts"
    ],
    ans: 1,
    d: "Domain 1: Cloud Concepts",
    w: false,
    e: "An Availability Zone (AZ) consists of one or more discrete data centers with redundant power, networking, and connectivity."
  },
  {
    q: "Which pillar of the AWS Well-Architected Framework refers to the ability of a system to recover from infrastructure or service disruptions and dynamically acquire computing resources to meet demand?",
    opts: [
      "Security",
      "Reliability",
      "Performance efficiency",
      "Cost optimization"
    ],
    ans: 1,
    d: "Domain 1: Cloud Concepts",
    w: false,
    e: "The Reliability pillar focuses on the ability of a workload to perform its intended function correctly and consistently when it's expected to, including recovering from disruptions."
  },
  {
    q: "Who is responsible for configuration management under the AWS shared responsibility model?",
    opts: [
      "It is solely the responsibility of the customer.",
      "It is solely the responsibility of AWS.",
      "It is shared between AWS and the customer.",
      "It is not part of the AWS shared responsibility model."
    ],
    ans: 2,
    d: "Domain 2: Security and Compliance",
    w: true,
    e: "Configuration management is a shared control. AWS configures infrastructure devices, while the customer is responsible for configuring their own guest operating systems, databases, and applications."
  },
  {
    q: "Which duties are the responsibility of a company that is using AWS Lambda? (Select the best combined option)",
    opts: [
      "Security inside of code & Writing and updating of code",
      "Patching of operating system & Security of underlying infrastructure",
      "Selection of CPU resources & Writing and updating of code",
      "Security inside of code & Patching of operating system"
    ],
    ans: 0,
    d: "Domain 2: Security and Compliance",
    w: true,
    e: "AWS Lambda is a fully managed serverless service. AWS handles the OS, infrastructure, and CPU. You are only responsible for the code you write and the security inside that code."
  },
  {
    q: "Which compute hosting model should be accounted for in the Total Cost of Ownership (TCO) when undertaking a cost analysis that allows physical isolation of a customer workload?",
    opts: [
      "Dedicated Hosts",
      "Reserved Instances",
      "On-Demand Instances",
      "No Upfront Reserved Instances"
    ],
    ans: 0,
    d: "Domain 4: Billing, Pricing, and Support",
    w: false,
    e: "Dedicated Hosts provide physical servers fully dedicated to your use, giving you hardware isolation for compliance or specific licensing models."
  },
  {
    q: "Who is accountable for security and compliance under the AWS shared responsibility model?",
    opts: [
      "The customer is responsible.",
      "AWS is responsible.",
      "AWS and the customer share responsibility.",
      "AWS shares responsibility with the relevant governing body."
    ],
    ans: 2,
    d: "Domain 2: Security and Compliance",
    w: true,
    e: "Security and compliance is a shared responsibility. AWS is responsible for security OF the cloud, while the customer is responsible for security IN the cloud."
  },
  {
    q: "Which of the following is a critical design concept for architecting cloud applications?",
    opts: [
      "Use the largest instance possible",
      "Provision capacity for peak load",
      "Use the Scrum development process",
      "Implement elasticity"
    ],
    ans: 3,
    d: "Domain 1: Cloud Concepts",
    w: false,
    e: "Elasticity allows applications to scale resources up or down automatically based on demand, ensuring performance while optimizing costs without over-provisioning."
  },
  {
    q: "Which AWS services or features provide disaster recovery solutions for Amazon EC2 instances? (Select the best combined option)",
    opts: [
      "Reserved Instances & AWS Shield",
      "Amazon EBS snapshots & Amazon GuardDuty",
      "EC2 AMIs & Amazon EBS snapshots",
      "AWS Shield & EC2 AMIs"
    ],
    ans: 2,
    d: "Domain 3: Cloud Technology and Services",
    w: false,
    e: "AMIs save the configuration and OS state, while EBS Snapshots back up the persistent storage volumes. Together, they allow you to restore EC2 instances during a disaster."
  },
  {
    q: "A company wants to review its monthly costs of using Amazon EC2 and Amazon RDS for the past year. Which AWS service or tool provides this information?",
    opts: [
      "AWS Trusted Advisor",
      "Cost Explorer",
      "Amazon Forecast",
      "Amazon CloudWatch"
    ],
    ans: 1,
    d: "Domain 4: Billing, Pricing, and Support",
    w: false,
    e: "AWS Cost Explorer lets you visualize, understand, and manage your AWS costs and usage over time, providing historical data for up to the past 12 months."
  },
  {
    q: "Who is the main point of contact for billing or account questions if a user has an AWS account with an Enterprise-level AWS Support plan?",
    opts: [
      "Solutions architect",
      "AWS Concierge Support team",
      "An AWS Marketplace seller",
      "AWS Partner Network (APN) partner"
    ],
    ans: 1,
    d: "Domain 4: Billing, Pricing, and Support",
    w: false,
    e: "Enterprise Support plans include access to the AWS Concierge Support team, who specialize in billing, account management, and operational inquiries."
  },
  {
    q: "What is one technique to provide unified billing if each department within a firm has its own AWS account?",
    opts: [
      "Use AWS Budgets on each account to pay only to budget.",
      "Contact AWS Support for a monthly bill.",
      "Create an AWS Organization from the payer account and invite the other accounts to join.",
      "Put all invoices into one Amazon S3 bucket, load data into Amazon Redshift, and run a billing report."
    ],
    ans: 2,
    d: "Domain 4: Billing, Pricing, and Support",
    w: false,
    e: "AWS Organizations offers a Consolidated Billing feature, allowing you to aggregate payments across multiple AWS accounts into a single master/payer account."
  },
  {
    q: "Which cloud architecture design concept is supported by distributing workloads across various Availability Zones?",
    opts: [
      "Implement automation.",
      "Design for agility.",
      "Design for failure.",
      "Implement elasticity."
    ],
    ans: 2,
    d: "Domain 1: Cloud Concepts",
    w: false,
    e: "Distributing workloads across multiple AZs ensures that if one AZ fails completely, your application remains operational in the other zones, which is designing for failure."
  },
  {
    q: "Which security-related duty is AWS accountable for under the AWS shared responsibility model?",
    opts: [
      "Lifecycle management of IAM credentials",
      "Physical security of global infrastructure",
      "Encryption of Amazon EBS volumes",
      "Firewall configuration"
    ],
    ans: 1,
    d: "Domain 2: Security and Compliance",
    w: true,
    e: "AWS is strictly accountable for the physical security of its data centers, hardware, and global infrastructure. The other options are customer responsibilities."
  },
  {
    q: "A company wants to migrate a critical application to AWS. The application has a short runtime. The application is invoked by changes in data or by shifts in system state. The company needs a compute solution that maximizes operational efficiency and minimizes the cost of running the application. Which AWS solution should the company use to meet these requirements?",
    opts: [
      "Amazon EC2 On-Demand Instances",
      "AWS Lambda",
      "Amazon EC2 Reserved Instances",
      "Amazon EC2 Spot Instances"
    ],
    ans: 1,
    d: "Domain 3: Cloud Technology and Services",
    w: true,
    e: "An application with a short runtime that is invoked by data changes is an event-driven workload. AWS Lambda is the ideal serverless compute solution for this, charging only for the exact runtime."
  },
  {
    q: "Which AWS service or feature allows users to connect with and deploy AWS services programmatically?",
    opts: [
      "AWS Management Console",
      "AWS Cloud9",
      "AWS CodePipeline",
      "AWS software development kits (SDKs)"
    ],
    ans: 3,
    d: "Domain 3: Cloud Technology and Services",
    w: false,
    e: "AWS SDKs allow you to interact with AWS services programmatically using your preferred programming language, embedding AWS functionality directly into your code."
  },
  {
    q: "According to the AWS shared responsibility model, who is responsible for managing IAM user access and secret keys?",
    opts: [
      "IAM access and secret keys are static, so there is no need to rotate them.",
      "The customer is responsible for rotating keys.",
      "AWS will rotate the keys whenever required.",
      "The AWS Support team will rotate keys when requested by the customer."
    ],
    ans: 1,
    d: "Domain 2: Security and Compliance",
    w: false,
    e: "Credentials, users, and permissions are managed 'in the cloud,' meaning the rotation and safeguarding of IAM keys fall solely on the customer."
  },
  {
    q: "To install a PCI-compliant workload on AWS, which of the following tasks is required?",
    opts: [
      "Use any AWS service and implement PCI controls at the application layer",
      "Use an AWS service that is in-scope for PCI compliance and raise an AWS support ticket to enable PCI compliance at the application layer",
      "Use any AWS service and raise an AWS support ticket to enable PCI compliance on that service",
      "Use an AWS service that is in scope for PCI compliance and apply PCI controls at the application layer"

// â”€â”€ Re-chunk 400 questions into 8 sets of 65 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const ALL_QUESTIONS = SETS.flat();
const TARGET_TOTAL = 520; // 8 Ã— 65
for (let _i = ALL_QUESTIONS.length; _i < TARGET_TOTAL; _i++) {
  ALL_QUESTIONS.push({
    q: `Placeholder #${_i - 399} â€” This question slot is reserved for upcoming AWS CLF-C02 exam content.`,
    opts: ["Content coming soon", "Content coming soon", "Content coming soon", "Content coming soon"],
    ans: 0, d: "Content Pending", placeholder: true,
    e: "This question will be replaced with actual exam content in a future update."
  });
}
const EXAM_SETS = Array.from({length: 8}, (_, i) => ALL_QUESTIONS.slice(i * 65, (i + 1) * 65));

// â”€â”€ Application State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let currentSet       = null;
let currentQ         = 0;
let userAnswers      = [];
let submitted        = []; // true = answer locked by user
let flaggedQuestions = [];
let setScores        = {};
let qCount           = 0;
let reviewMode       = false;

// â”€â”€ Timer State â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let timerInterval = null;
let timerSeconds  = 5400;
let timerRunning  = false;

// â”€â”€ Timer Functions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function startTimer() {
  timerSeconds = 5400;
  timerRunning = true;
  document.getElementById('hdr-timer').style.display = 'flex';
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds--;
    updateTimerDisplay();
    if (timerSeconds <= 0) {
      clearInterval(timerInterval);
      timerRunning = false;
      finishExam();
    }
  }, 1000);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  timerRunning = false;
  const el = document.getElementById('hdr-timer');
  if (el) el.style.display = 'none';
}

function updateTimerDisplay() {
  const h    = Math.floor(timerSeconds / 3600);
  const m    = Math.floor((timerSeconds % 3600) / 60);
  const s    = timerSeconds % 60;
  const text = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el   = document.getElementById('timer-display');
  const pill = document.getElementById('hdr-timer');
  el.textContent = text;
  if (timerSeconds < 600) {
    el.style.color = 'var(--incorrect)'; pill.style.borderColor = 'var(--incorrect)';
  } else if (timerSeconds < 1800) {
    el.style.color = 'var(--orange)'; pill.style.borderColor = 'var(--orange)';
  } else {
    el.style.color = 'var(--correct)'; pill.style.borderColor = 'var(--correct)';
  }
}

// â”€â”€ Utility â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function isAnswerCorrect(userAns, correctAns) {
  if (Array.isArray(correctAns)) {
    if (!Array.isArray(userAns) || userAns.length !== correctAns.length) return false;
    return correctAns.every(val => userAns.includes(val));
  }
  return userAns === correctAns;
}

// â”€â”€ Set Selection Screen â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderSetScreen() {
  reviewMode = false;
  stopTimer();
  document.getElementById('set-screen').style.display      = 'block';
  document.getElementById('quiz-screen').style.display     = 'none';
  document.getElementById('results-screen').style.display  = 'none';
  document.getElementById('hdr-prog').style.display        = 'none';
  document.getElementById('hdr-score').style.display       = 'none';
  document.getElementById('back-btn').style.display        = 'none';
  document.getElementById('finish-exam-btn').style.display = 'none';

  const grid = document.getElementById('sets-grid');
  grid.innerHTML = EXAM_SETS.map((set, i) => {
    const score  = setScores[i];
    const done   = score !== undefined;
    const realQs = set.filter(q => !q.placeholder).length;
    const pct    = done ? Math.round((score / realQs) * 100) : null;
    return `
      <div class="set-card ${done ? 'done' : ''}" onclick="startSet(${i})">
        ${done ? `<div class="set-score-badge">${pct}% ${pct >= 70 ? 'âœ“ PASS' : 'âœ— FAIL'}</div>` : ''}
        <div class="set-num">0${i + 1}</div>
        <div class="set-name">Practice Set ${i + 1}</div>
        <div class="set-info">${realQs} questions &middot; ${done ? 'Retake' : 'Start'}</div>
      </div>`;
  }).join('');
}

// â”€â”€ Start Set â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function startSet(setIndex) {
  reviewMode       = false;
  currentSet       = setIndex;
  currentQ         = 0;
  qCount           = EXAM_SETS[currentSet].length;
  userAnswers      = EXAM_SETS[currentSet].map(q => Array.isArray(q.ans) ? [] : null);
  submitted        = new Array(qCount).fill(false);
  flaggedQuestions = new Array(qCount).fill(false);

  document.getElementById('set-screen').style.display      = 'none';
  document.getElementById('quiz-screen').style.display     = 'block';
  document.getElementById('results-screen').style.display  = 'none';
  document.getElementById('hdr-prog').style.display        = 'block';
  document.getElementById('hdr-score').style.display       = 'block';
  document.getElementById('back-btn').style.display        = 'block';
  document.getElementById('finish-exam-btn').style.display = 'block';
  document.getElementById('prog-label').textContent        = `0/${qCount}`;

  startTimer();
  renderQuestion();
  updateProgress();
}

// â”€â”€ Render Question â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function renderQuestion() {
  const q           = EXAM_SETS[currentSet][currentQ];
  const isPlaceholder = !!q.placeholder;
  const isMulti     = Array.isArray(q.ans);
  const userSel     = userAnswers[currentQ];
  const isFlagged   = flaggedQuestions[currentQ];
  const isFirst     = currentQ === 0;
  const isLast      = currentQ === qCount - 1;
  const isLocked    = submitted[currentQ];

  // Determine if current selection is complete
  const hasAnswer = isMulti
    ? (Array.isArray(userSel) && userSel.length === q.ans.length)
    : userSel !== null;

  // Build options
  const optsHtml = q.opts.map((opt, i) => {
    const isCorrect  = isMulti ? q.ans.includes(i) : i === q.ans;
    const isSelected = isMulti
      ? (Array.isArray(userSel) && userSel.includes(i))
      : userSel === i;

    let cls = '';
    if (isPlaceholder) {
      cls = 'disabled placeholder-opt';
    } else if (reviewMode) {
      // Full feedback revealed only in review mode
      cls = 'disabled ';
      if (isCorrect) cls += 'correct';
      else if (isSelected) cls += 'incorrect';
    } else {
      // Active exam: selection highlight only â€” NO correct/incorrect feedback
      if (isLocked) cls = 'disabled ';
      if (isSelected) cls += 'selected';
    }

    const clickable = !reviewMode && !isPlaceholder && !isLocked;
    return `
      <div class="opt ${cls.trim()}"${clickable ? ` onclick="selectOpt(${i})"` : ''} id="opt${i}">
        <span class="opt-ltr">${String.fromCharCode(65 + i)}</span>
        <span>${opt}</span>
      </div>`;
  }).join('');

  // Explanation: ONLY shown in review mode after exam ends
  const showExp = reviewMode && !isPlaceholder;

  // Center action button
  let centerBtn = '';
  if (isPlaceholder) {
    centerBtn = '';
  } else if (reviewMode) {
    centerBtn = `<button class="btn btn-ghost" onclick="backToResults()">&#x21A9; Results</button>`;
  } else if (isLocked) {
    centerBtn = `<button class="btn btn-lock locked" disabled>&#x1F512; Locked</button>`;
  } else {
    centerBtn = `<button class="btn btn-lock" onclick="lockAnswer()"${!hasAnswer ? ' disabled' : ''}>&#x1F513; Lock Answer</button>`;
  }

  // Right navigation button
  let rightBtn = '';
  if (!reviewMode && isLast) {
    rightBtn = `<button class="btn btn-finish-q" onclick="finishExam()">Finish Exam &#x2713;</button>`;
  } else {
    const disableNext = isLast && reviewMode;
    rightBtn = `<button class="btn btn-secondary" onclick="navQ(1)"${disableNext ? ' disabled' : ''}>Next &rarr;</button>`;
  }

  document.getElementById('q-container').innerHTML = `
    <div class="q-card${isPlaceholder ? ' placeholder-card' : ''}">
      <div class="q-meta">
        <span class="q-num">Set ${currentSet + 1} &middot; Q${currentQ + 1}/${qCount}</span>
        ${isMulti ? `<span class="q-num" style="background:rgba(56,139,253,0.1);color:#58a6ff;border:1px solid rgba(56,139,253,0.2)">Select ${q.ans.length}</span>` : ''}
        ${isPlaceholder ? `<span class="q-num" style="background:rgba(125,133,144,.15);color:var(--muted);border:1px solid var(--border)">Content Pending</span>` : ''}
        ${reviewMode ? `<span class="q-num" style="background:rgba(227,179,65,.1);color:#e3b341;border:1px solid rgba(227,179,65,.3)">Review Mode</span>` : ''}
        ${!isPlaceholder && !reviewMode ? `
          <button class="btn-flag${isFlagged ? ' flagged' : ''}" onclick="toggleFlag()" title="${isFlagged ? 'Remove flag' : 'Flag for review'}">
            ${isFlagged ? '&#x1F6A9; Flagged' : '&#x2690; Flag'}
          </button>` : ''}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">${optsHtml}</div>
      <div class="exp${showExp ? ' show' : ''}">
        <strong>&#x1F4A1; EXPLANATION</strong>${q.e}
      </div>
      <div class="nav-btns">
        <button class="btn btn-secondary" onclick="navQ(-1)"${isFirst ? ' disabled' : ''}>&larr; Prev</button>
        <div class="center-actions">${centerBtn}</div>
        ${rightBtn}
      </div>
    </div>`;
}

// â”€â”€ Interactions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function selectOpt(i) {
  if (reviewMode) return;
  const q = EXAM_SETS[currentSet][currentQ];
  if (q.placeholder || submitted[currentQ]) return;

  if (Array.isArray(q.ans)) {
    let arr = Array.isArray(userAnswers[currentQ]) ? [...userAnswers[currentQ]] : [];
    if (arr.includes(i)) {
      arr = arr.filter(x => x !== i);
    } else if (arr.length < q.ans.length) {
      arr.push(i);
    }
    userAnswers[currentQ] = arr;
  } else {
    userAnswers[currentQ] = i;
  }
  renderQuestion();
  updateProgress();
}

function lockAnswer() {
  if (reviewMode || submitted[currentQ]) return;
  const q       = EXAM_SETS[currentSet][currentQ];
  const userSel = userAnswers[currentQ];
  const isMulti = Array.isArray(q.ans);
  const hasAnswer = isMulti
    ? (Array.isArray(userSel) && userSel.length === q.ans.length)
    : userSel !== null;
  if (!hasAnswer) return;
  submitted[currentQ] = true;
  renderQuestion();
}

function toggleFlag() {
  if (reviewMode) return;
  flaggedQuestions[currentQ] = !flaggedQuestions[currentQ];
  renderQuestion();
}

function navQ(dir) {
  const next = currentQ + dir;
  if (next < 0 || next >= qCount) return;
  currentQ = next;
  renderQuestion();
}

function updateProgress() {
  let answered = 0, realTotal = 0;
  for (let i = 0; i < qCount; i++) {
    const q = EXAM_SETS[currentSet][i];
    if (q.placeholder) continue;
    realTotal++;
    const a    = userAnswers[i];
    const done = Array.isArray(q.ans)
      ? (Array.isArray(a) && a.length === q.ans.length)
      : a !== null;
    if (done) answered++;
  }
  document.getElementById('prog-label').textContent  = `${answered}/${realTotal}`;
  document.getElementById('prog-fill').style.width   = realTotal > 0 ? `${(answered / realTotal) * 100}%` : '0%';
  document.getElementById('live-score').textContent  = answered;
}

// â”€â”€ Finish & Results â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function finishExam() {
  stopTimer();
  reviewMode = true;
  document.getElementById('finish-exam-btn').style.display = 'none';
  showResults();
}

function showResults() {
  const set = EXAM_SETS[currentSet];
  let correct = 0, realTotal = 0;
  for (let i = 0; i < set.length; i++) {
    if (set[i].placeholder) continue;
    realTotal++;
    if (isAnswerCorrect(userAnswers[i], set[i].ans)) correct++;
  }
  setScores[currentSet] = correct;
  const pct  = realTotal > 0 ? Math.round((correct / realTotal) * 100) : 0;
  const pass = pct >= 70;

  document.getElementById('quiz-screen').style.display     = 'none';
  document.getElementById('results-screen').style.display  = 'block';
  document.getElementById('hdr-score').style.display       = 'none';
  document.getElementById('hdr-prog').style.display        = 'none';
  document.getElementById('finish-exam-btn').style.display = 'none';

  document.getElementById('res-title').textContent     = `Set ${currentSet + 1} Complete`;
  document.getElementById('final-pct').textContent     = pct + '%';
  document.getElementById('pass-fail-lbl').textContent = pass ? 'PASS \u2713' : 'FAIL \u2014 Keep Studying';
  document.getElementById('score-circle').className    = 'score-circle ' + (pass ? 'pass' : 'fail');
  document.getElementById('r-correct').textContent     = correct;
  document.getElementById('r-wrong').textContent       = realTotal - correct;
  document.getElementById('r-pct').textContent         = pct + '%';

  document.getElementById('r-dots').innerHTML =
    `<p style="width:100%;text-align:center;font-size:12px;color:var(--muted);margin-bottom:10px;">Click any number to review that question &amp; see the explanation</p>` +
    set.map((q, i) => {
      if (q.placeholder) return `<div class="r-dot" style="opacity:.25;cursor:default;" title="Placeholder">&middot;</div>`;
      const a       = userAnswers[i];
      const hasAns  = Array.isArray(q.ans)
        ? (Array.isArray(a) && a.length === q.ans.length) : a !== null;
      const correct_q = hasAns && isAnswerCorrect(a, q.ans);
      const flagged   = flaggedQuestions[i];
      const cls       = hasAns ? (correct_q ? 'correct' : 'incorrect') : '';
      return `<div class="r-dot ${cls}${flagged ? ' flagged-dot' : ''}" onclick="jumpTo(${i})" title="Q${i + 1}${flagged ? ' \uD83D\uDEA9' : ''}">${i + 1}</div>`;
    }).join('');
}

function backToResults() {
  document.getElementById('quiz-screen').style.display    = 'none';
  document.getElementById('results-screen').style.display = 'block';
  document.getElementById('hdr-prog').style.display       = 'none';
}

function jumpTo(i) {
  currentQ = i;
  document.getElementById('quiz-screen').style.display    = 'block';
  document.getElementById('results-screen').style.display = 'none';
  document.getElementById('hdr-prog').style.display       = 'block';
  renderQuestion();
}

function retakeSet() {
  reviewMode = false;
  startSet(currentSet);
}

function goHome() {
  stopTimer();
  reviewMode = false;
  renderSetScreen();
}

renderSetScreen();

</script>
</body>
